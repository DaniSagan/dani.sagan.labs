<svg viewBox="0 0 640 460" role="group" aria-label="Mapa coloreable y grafo de adyacencias">
  <g *ngFor="let cell of map.cells; let i = index" [attr.role]="interactive ? 'button' : 'img'"
    [attr.tabindex]="interactive ? 0 : null"
    [attr.aria-label]="'Región ' + label(i) + ', ' + (colors[i] >= 0 ? 'color ' + (colors[i] + 1) : 'sin color') + (interactive ? '. Seleccionar' : '')"
    [attr.aria-pressed]="interactive ? selected === i : null" (click)="select($event, i)"
    (keydown.enter)="select($event, i)" (keydown.space)="select($event, i)">
    <polygon [attr.points]="polygon(i)" [attr.fill]="fill(i)" [class.selected]="selected === i"
      [class.highlight]="highlight.includes(i)" />
  </g>
  <g *ngIf="dual" class="dual" aria-hidden="true">
    <line *ngFor="let e of map.edges" [attr.x1]="map.sites[e[0]].x" [attr.y1]="map.sites[e[0]].y"
      [attr.x2]="map.sites[e[1]].x" [attr.y2]="map.sites[e[1]].y" [class.conflict]="conflict(e[0],e[1])" />
  </g>
  <g *ngFor="let site of map.sites; let i = index" class="label" aria-hidden="true">
    <circle [attr.cx]="site.x" [attr.cy]="site.y" r="19" /><text [attr.x]="site.x" [attr.y]="site.y + 5"
      text-anchor="middle">{{ label(i) }}{{ colors[i] >= 0 ? '·' + (colors[i] + 1) : '' }}</text>
  </g>
</svg>
<p>Etiqueta = región · número de color. <span *ngIf="dual">Las líneas unen regiones vecinas; las discontinuas señalan
    conflictos.</span></p>
