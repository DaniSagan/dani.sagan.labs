<svg viewBox="0 0 660 270" role="img" [attr.aria-label]="description">
  @for (tick of ticks; track tick) {
  <line x1="64" x2="634" [attr.y1]="y(tick)" [attr.y2]="y(tick)" stroke="#27364e" />
  <text x="56" [attr.y]="y(tick) + 4" text-anchor="end">
    {{ format(tick) }}
  </text>
  }
  <line x1="64" x2="634" [attr.y1]="y(0)" [attr.y2]="y(0)" stroke="#647895" />
  @for (line of paths; track line.label) {
  <path [attr.d]="line.path" fill="none" [attr.stroke]="line.color" stroke-width="2.2" />
  }
  @if (marker !== null) {
  <line [attr.x1]="64 + (marker / end) * 570" [attr.x2]="64 + (marker / end) * 570" y1="20" y2="225" stroke="#ffd18a"
    stroke-dasharray="5 4" />
  }
  <text x="64" y="250">0</text>
  <text x="350" y="250" text-anchor="middle">{{ xLabel }}</text>
  <text x="634" y="250" text-anchor="end">{{ end }}</text>
</svg>
<div class="legend">
  @for (line of series; track line.label) {
  <span [style.color]="line.color">━ {{ line.label }}</span>
  }
</div>
<p class="scale">Escala vertical: {{ format(min) }} a {{ format(max) }}</p>
