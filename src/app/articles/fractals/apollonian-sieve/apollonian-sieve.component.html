<h2>Tamíz de Apolonio</h2>
<div class="widget-container">
  <div class="widget-title">Tamiz de Apolonio</div>
  <div class="legacy-workspace"><div class="legacy-stage"><canvas role="img" aria-label="Visualización interactiva del fractal" #canvas [width]="width" [height]="height"></canvas></div><div class="legacy-console"><div>
    <div>
      <label for="depth">Profundidad: {{maxDepth}}</label>
      <input id="depth" type="range" min="0" max="7" step="1" [(ngModel)]="maxDepth" (ngModelChange)="update()">
    </div>
    <div>
      <label for="radius1">Radio 1: {{radius1}}</label>
      <input id="radius1" type="range" min="80" max="250" [(ngModel)]="radius1" (ngModelChange)="update()">
    </div>
    <div>
      <label for="radius2">Radio 2: {{radius2}}</label>
      <input id="radius2" type="range" min="80" max="250" [(ngModel)]="radius2" (ngModelChange)="update()">
    </div>
    <div>
      <label for="radius3">Radio 3: {{radius3}}</label>
      <input id="radius3" type="range" min="80" max="250" [(ngModel)]="radius3" (ngModelChange)="update()">
    </div>

  </div></div></div>


</div>
